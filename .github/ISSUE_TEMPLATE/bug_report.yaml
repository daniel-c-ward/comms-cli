name: Bug Report
description: Report a reproducible bug
title: "[BUG] "
labels: ["bug"]
assignees:
  - daniel-c-ward
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the following sections to help us investigate.
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Please provide clear steps to reproduce the bug.
      placeholder: |
        1. Run 'comms serve --port 0'
        2. Run 'comms join pi myagent'
        3. Observe error
      value: ""
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: The command should succeed and start the agent.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: The command failed with exit code 1 and printed "comms: ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of comms-cli are you using? (e.g., v0.1.0)
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      options:
        - Ubuntu/Debian
        - macOS
        - Windows
        - Other Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, logs, or screenshots about the problem here.
      placeholder: |
        Include any relevant log output, environment variables, or configuration.