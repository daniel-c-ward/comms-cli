name: Question
description: Ask a question about comms-cli
title: "[QUESTION] "
labels: ["question"]
assignees:
  - daniel-c-ward
body:
  - type: markdown
    attributes:
      value: |
        Got a question? We're happy to help! Please ask your question below.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Please ask your question clearly and concisely.
      placeholder: |
        Example: How do I configure the hub to listen on a specific interface?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of comms-cli are you using?
      placeholder: v0.1.0
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area does your question relate to?
      options:
        - Installation / Setup
        - Usage (serve, start, join, etc.)
        - Configuration
        - Extensions
        - Troubleshooting
        - Other
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context that might help us answer your question.
      placeholder: |
        Include any relevant command output, configuration files, or environment details.