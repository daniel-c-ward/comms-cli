name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', '1.23' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race

      - name: Lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.59.0
          golangci-lint run ./...

      - name: Security check (vulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          go build -o comms-linux-amd64 ./cmd/comms
          GOOS=darwin GOARCH=amd64 go build -o comms-darwin-amd64 ./cmd/comms
          GOOS=windows GOARCH=amd64 go build -o comms-windows-amd64.exe ./cmd/comms
          GOOS=linux GOARCH=arm64 go build -o comms-linux-arm64 ./cmd/comms
          GOOS=darwin GOARCH=arm64 go build -o comms-darwin-arm64 ./cmd/comms

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comms-binaries-${{ github.sha }}
          path: |
            comms-*