name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26', 'stable' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race

  quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Security check (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          go-package: ./...
          repo-checkout: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binaries
        run: |
          go build -o comms-linux-amd64 ./cmd/comms
          GOOS=darwin GOARCH=amd64 go build -o comms-darwin-amd64 ./cmd/comms
          GOOS=windows GOARCH=amd64 go build -o comms-windows-amd64.exe ./cmd/comms
          GOOS=linux GOARCH=arm64 go build -o comms-linux-arm64 ./cmd/comms
          GOOS=darwin GOARCH=arm64 go build -o comms-darwin-arm64 ./cmd/comms

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comms-binaries-${{ github.sha }}
          path: |
            comms-*
