# GoReleaser configuration for comms-cli
# https://goreleaser.com

version: 2

project_name: comms-cli

# Build settings
builds:
  - id: comms-cli
    binary: comms
    main: ./cmd/comms
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

# Archive settings
archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "windows" }}windows-
      {{- else if eq .Os "darwin" }}darwin-
      {{- else }}linux-
      {{- end }}{{ if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

# Checksum
checksum:
  name_template: 'checksums.txt'

# Snapshots (for testing)
snapshot:
  version_template: "{{ .Tag }}-next"

# Release settings
release:
  github:
    owner: daniel-c-ward
    name: comms-cli
  # If not using GitHub Actions, you may need to set GITHUB_TOKEN here via env.

